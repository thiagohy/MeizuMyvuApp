plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.yourapp.myvu'
    compileSdk 34

    defaultConfig {
        applicationId "com.yourapp.myvu"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.navigation:navigation-fragment-ktx:2.7.6'
    implementation 'androidx.navigation:navigation-ui-ktx:2.7.6'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // Meizu MYVU SDK
    implementation 'com.github.Panny777.Meizu-Myvu-SDK:myvu-core:v0.3.0'
    implementation 'com.github.Panny777.Meizu-Myvu-SDK:myvu-nav:v0.3.0'
    implementation 'com.github.Panny777.Meizu-Myvu-SDK:myvu-ai:v0.3.0'
    implementation 'com.github.Panny777.Meizu-Myvu-SDK:myvu-weather:v0.3.0'

    // Network (for LLM APIs, Google Directions, Home Assistant)
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // Google Play Services (for location)
    implementation 'com.google.android.gms:play-services-location:21.1.0'

    // JSON
    implementation 'org.json:json:20231013'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
